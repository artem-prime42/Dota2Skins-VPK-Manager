name: Update catalog downloads

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      CATALOG_REPO_TOKEN: ${{ secrets.CATALOG_REPO_TOKEN }}
      CATALOG_URL: https://raw.githubusercontent.com/artem-prime42/dota2-mod-manager-catalog/main/catalog.json
    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4
        with:
          repository: artem-prime42/dota2-mod-manager
          path: app
          fetch-depth: 1

      - name: Checkout catalog repo
        uses: actions/checkout@v4
        with:
          repository: artem-prime42/dota2-mod-manager-catalog
          token: ${{ secrets.CATALOG_REPO_TOKEN }}
          path: catalog
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh catalog download counts
        working-directory: catalog
        run: |
          node ../app/scripts/update-catalog-download-counts.js --url "$CATALOG_URL" --output ./catalog.json

      - name: Commit and push updated catalog
        working-directory: catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          if git diff --cached --quiet; then
            echo "No catalog changes detected."
          else
            git commit -m "Update catalog download counts"
            git push https://x-access-token:${CATALOG_REPO_TOKEN}@github.com/artem-prime42/dota2-mod-manager-catalog.git HEAD:main
          fi

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https: data: blob:; connect-src 'self' https:">
  <title>Dota2skins</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0..1,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient" aria-hidden="true">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
  </div>

  <div id="app">
    <!-- Custom title bar -->
    <header id="titlebar">
      <div class="tb-brand">
        <img src="../build/icon.png" class="tb-icon" alt="App icon" data-i18n-alt="appIconAlt">
        <span class="tb-title" data-i18n="appTitle">Dota2skins</span>
        <span class="tb-sub" data-i18n="appSubtitle">Dota 2</span>
      </div>

      <div id="topNav" class="top-nav">
        <button class="tb-tab top-tab active" data-top="heroes" data-i18n="heroesSection">Heroes</button>
        <button class="tb-tab top-tab" data-top="world" data-i18n="worldSection">World</button>
        <button class="tb-tab top-tab" data-top="interface" data-i18n="interfaceSection">Interface</button>
        <button class="tb-tab top-tab" data-top="effects" data-i18n="effectsSection">Effects</button>
        <button class="tb-tab top-tab" data-top="other" data-i18n="otherSection">Other</button>
        <button class="tb-tab top-tab" data-top="tools" data-i18n="toolsSection">Tools</button>
      </div>

      <div class="tb-spacer"></div>
      <div class="tb-controls">
        <button class="tb-ctl" id="winMin" aria-label="Minimize" data-i18n-aria-label="minimize"><svg viewBox="0 0 12 12" width="12" height="12"><line x1="2" y1="6" x2="10" y2="6" stroke="currentColor" stroke-width="1.2"/></svg></button>
        <button class="tb-ctl" id="winFull" aria-label="Fullscreen" title="Fullscreen"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 2H2v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M9 2h1v2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M3 10H2v-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><path d="M9 10h1v-2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
        <button class="tb-ctl tb-close" id="winClose" aria-label="Close" data-i18n-aria-label="closeWindow"><svg viewBox="0 0 12 12" width="12" height="12"><path d="M3 3l6 6M9 3l-6 6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg></button>
      </div>
    </header>

    <!-- Body -->
    <div id="body">
      <div class="body-main">
        <main id="main">
          <div id="sectionSubnav" class="section-subnav"></div>
          <div id="view-root"></div>
        </main>
      </div>

      <aside class="side-panel">
        <div class="side-brand"></div>
        <div class="side-nav">
          <button class="tb-tab side-tab active" data-view="home"><span class="ms">home</span><span class="tab-label" data-i18n="home">Home</span></button>
          <button class="tb-tab side-tab" data-view="catalog"><span class="ms">apps</span><span class="tab-label" data-i18n="modsButton">Mods</span></button>
          <button class="tb-tab side-tab" data-view="library"><span class="ms">inventory</span><span class="tab-label" data-i18n="library">Library</span><span class="tb-badge" id="libCount"></span></button>
          <button class="tb-tab side-tab" data-view="presets"><span class="ms">playlist_add</span><span class="tab-label" data-i18n="presets">Presets</span></button>
          <button class="tb-tab side-tab" data-view="authors"><span class="ms">person</span><span class="tab-label" data-i18n="authors">Authors</span></button>
          <button class="tb-tab side-tab" data-view="settings"><span class="ms">settings</span><span class="tab-label" data-i18n="settings">Settings</span></button>
          <button class="tb-tab side-tab" data-view="about"><span class="ms">info</span><span class="tab-label" data-i18n="about">About</span></button>
        </div>
        <div id="sideCategories" class="side-categories"></div>
        <button class="side-launch" id="launchDotaBtn"><span class="ms">play_arrow</span><span data-i18n="launchDota">Launch Dota 2</span></button>
      </aside>
    </div>

    <!-- Status footer strip -->
    <footer id="statusbar">
      <span class="dot" id="dotaStatusDot"></span>
      <span id="dotaStatusText" data-i18n="dotaNotFound">Dota 2 not found — set the path in settings</span>
      <button class="status-link" id="openModsFolderBtn"><span class="ms">folder_open</span><span data-i18n="openModsFolder">Open mods folder</span></button>
    </footer>

    <!-- Progress bar (bottom) -->
    <div id="progressBar" class="progress-bar hidden">
      <div class="progress-info">
        <span id="progressLabel"></span>
        <span id="progressSize"></span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- Toasts -->
    <div id="toasts"></div>

    <!-- Modal -->
    <div id="modalOverlay" class="modal-overlay hidden">
      <div id="modalContent" class="modal-content"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
